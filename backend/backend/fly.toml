# Fly.io config for the interviewer API. See docs/docs/DEPLOY_FLY_SUPABASE.md for secrets and setup.
# Secrets (API_KEYS, DATABASE_URL, REDIS_URL, CORS_ORIGINS, WEBHOOK_SECRET, provider keys...) are set with
# `fly secrets set`, never here.

app = "interviewer-ms"
# Pick the region closest to your Supabase project (every query is a network call). Change before deploying.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "::"                # listen on IPv6 so Fly's private network (.internal / .flycast) can reach it
  PLANS_ENABLED = "true"
  REQUIRE_CONSENT = "true"
  FINISH_ASYNC = "true"       # POST /finish answers 202; the report is built in the background
  # A hung AI call waits this long before the next provider is tried (default 60 s). Healthy Luna calls take 4-30 s,
  # so 40 s falls back sooner without cutting off slow but working calls. The caller's own timeout must be longer.
  LLM_TIMEOUT_SECONDS = "40"
  # A report build with no progress for this long is taken over by the other machine (default 300 s). A normal build
  # takes 25-35 s; a worst case with one fallback can pass two minutes, and a lower value would build it twice.
  FINISH_STALE_SECONDS = "180"
  # Interviews, answers and reports older than this are deleted (hourly sweep). Wallets and purchases are not touched. The
  # privacy policy and the "reports are kept for N days" notice in the main app must say the same number.
  RETENTION_DAYS = "90"
  # Limits are per TENANT, and the whole main app is one tenant, so the defaults (20 AI-backed calls a minute, 2000 a
  # day) would cap the platform at about one interview a minute. One interview is roughly 10 to 20 such calls. These
  # are starting values for staging; size them from the load test. Per-student limits (30/min, 200/day) stay as the
  # abuse control. The daily budget is also a cost ceiling, so set it deliberately.
  RATE_LIMIT_PER_MINUTE = "1200"
  RATE_LIMIT_EXPENSIVE_PER_MINUTE = "300"
  DAILY_EXPENSIVE_BUDGET = "20000"

# Private service: no [http_service], and deploy with `fly deploy --no-public-ips`, so nothing is reachable from the
# internet. The main app calls it over Fly's private network (http://interviewer-ms.internal:8080, or .flycast after
# `fly ips allocate-v6 --private`). If the main app is NOT in the same Fly org, replace this block with a public
# [http_service] (force_https = true) and review CORS_ORIGINS and API_KEYS first.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  # Capacity follows load, and the service SLEEPS when idle (min 0): with no interview in progress Fly's proxy stops
  # every machine, and the next request starts one. The main app expects this (Resumeto V-SLEEP, #495): its interview
  # page wakes the service when a student opens it and shows "Getting your interviewer ready" for the ~60 s the speech
  # model needs to load, a start is refused as "busy" until /ready answers 200, and its health collector does not probe
  # a stopped machine. The other machines are created once (`fly scale count 3`) and stay stopped until Fly's proxy
  # sees every running machine at the soft limit below; it then starts one, and stops idle ones again. Interview state
  # lives in Postgres, not in the machine, so stopping one loses nothing; the only thing in a machine's memory is a
  # report being built, and if a machine is stopped during that, the sweeper on the next running machine takes it over
  # after FINISH_STALE_SECONDS. With every machine stopped, the main app's 5-minute reconcile asks about the
  # `processing` interview, which starts a machine, and its sweeper finishes the report. This absorbs a gradual rise in
  # students, not a burst in the same second. See docs/docs/STAGING.md section 10 for the test.
  # To keep one machine always on again (no ~60 s wait for the first student), set min_machines_running = 1.
  # For a fixed number of always-on machines set auto_stop_machines = "off" and min_machines_running = that number.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [services.concurrency]
    type = "requests"
    soft_limit = 6     # each machine transcribes 2 answers at once; beyond about 6 requests in flight, add a machine
    hard_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

  [[services.http_checks]]
    method = "GET"
    path = "/api/v1/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"   # Fly caps this at 60 s. The speech model loads in the background; /ready is 503 until then

# Speech-to-text (Whisper base, int8, on the CPU) is the bottleneck, so the CPU kind matters more than anything else.
# Staging load test, 2026-11-07, 36 s clips, sustained, per machine (notes: project memory
# `interviewer-loadtest-2026-11-07`, writeup in the Jarvis repo vault/output/2026-11-07-interviewer-staging-load-test.md):
#   shared-cpu-2x   1.6 answers/min  (throttled after ~45 s; failed at 10 simultaneous students)
#   shared-cpu-8x   2.1 answers/min  (throttled after ~2 min; failed 30 at once)
#   performance-1x  8.6 answers/min  (about 310 s of audio per minute, no throttling)
#   performance-2x 15.6 answers/min  (about 560 s of audio per minute, no throttling)  <- chosen
# performance-2x costs about $0.092 an hour per running machine (4 GB is its smallest preset; memory peaked at 863 MB).
# Planning figure: one performance-2x machine carries about 10 students at once if answers average ~90 s (about 16 at
# 60 s). Halve the 36 s-clip numbers for long answers; size booked slots from the real average answer length.
# Machines sleep when idle (min_machines_running = 0), so start the machines a slot needs BEFORE the slot: a cold burst
# pins every connection to the first machine that wakes.
[[vm]]
  size = "performance-2x"
  memory = "4gb"
