# Fly.io config for the interviewer API. See docs/docs/DEPLOY_FLY_SUPABASE.md for secrets and setup.
# Secrets (API_KEYS, DATABASE_URL, REDIS_URL, CORS_ORIGINS, WEBHOOK_SECRET, provider keys...) are set with
# `fly secrets set`, never here.

app = "interviewer-ms"
# Pick the region closest to your Supabase project (every query is a network call). Change before deploying.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "::"                # listen on IPv6 so Fly's private network (.internal / .flycast) can reach it
  PLANS_ENABLED = "true"
  REQUIRE_CONSENT = "true"
  FINISH_ASYNC = "true"       # POST /finish answers 202; the report is built in the background
  # Limits are per TENANT, and the whole main app is one tenant, so the defaults (20 AI-backed calls a minute, 2000 a
  # day) would cap the platform at about one interview a minute. One interview is roughly 10 to 20 such calls. These
  # are starting values for staging; size them from the load test. Per-student limits (30/min, 200/day) stay as the
  # abuse control. The daily budget is also a cost ceiling, so set it deliberately.
  RATE_LIMIT_PER_MINUTE = "1200"
  RATE_LIMIT_EXPENSIVE_PER_MINUTE = "300"
  DAILY_EXPENSIVE_BUDGET = "20000"

# Private service: no [http_service], and deploy with `fly deploy --no-public-ips`, so nothing is reachable from the
# internet. The main app calls it over Fly's private network (http://interviewer-ms.internal:8080, or .flycast after
# `fly ips allocate-v6 --private`). If the main app is NOT in the same Fly org, replace this block with a public
# [http_service] (force_https = true) and review CORS_ORIGINS and API_KEYS first.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "off"     # interviews hold in-flight state; keep machines running
  auto_start_machines = true
  min_machines_running = 2

  [services.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.http_checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

  [[services.http_checks]]
    method = "GET"
    path = "/api/v1/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"   # Fly caps this at 60 s. The speech model loads in the background; /ready is 503 until then

# Whisper base (int8) plus the API need ~1 GB under load; 2 GB leaves headroom for concurrent transcriptions.
[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
